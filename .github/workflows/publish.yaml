name: Publish
'on':
  push:
    branches:
    - master
  workflow_dispatch:
    inputs:
      repository:
        description: 'Who called'
        required: false
        type: string
  repository_dispatch:
    types:
    - publish
jobs:
  job:
    name: Github Pages
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Check out source repository
      uses: actions/checkout@v4
    - name: Checkout Freelancer
      if: ${{ steps.cache-freelancer.outputs.cache-hit != 'true' }}
      uses: darklab8/fl-darkstat/.github/actions/checkout-freelancer@master
      with:
        freelancer-mod: discovery486
        freelancer-folder: ${{ github.workspace }}/freelancer_folder

    - name: Install Go
      uses: darklab8/infra/.github/actions/install-go@master
    - name: Darkstat Build
      uses: darklab8/fl-darkstat/.github/actions/build@master
      with:
        site-host: https://darkstat.dd84ai.com
        site-root: /fl-data-discovery486/
        freelancer-folder: ${{ github.workspace }}/freelancer_folder
        heading: <a href="https://github.com/darklab8/fl-darkstat">Darkstat</a> from <a href="https://darklab8.github.io/blog/pet_projects.html#Freelancercommunity">DarkTools</a> for <a href="https://github.com/darklab8/fl-data-discovery486">Disco486</a>
        command: --stat-deals-on build
        map-index-url: map.html
        map-on: "true"
        map-args: --map-padding=1.5
        disable-dev-mode: "false"
    - name: Upload artifacts for deployment to Github Pages
      uses: actions/upload-pages-artifact@v3
      with:
        name: github-pages
        path: './build'
    - name: Deploy to pages
      uses: actions/deploy-pages@v4
      id: deployment

